[package]
name = "tool-list-changed"
version = "0.1.2"
edition = "2021"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
git-version = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64-serde = "0.7"
base64 = "0.21"

[package.metadata.release]
publish = false
push = true
tag = true
tag-name = "v{{version}}"
